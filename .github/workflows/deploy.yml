name: Deploy portal to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  qa:
    uses: ./.github/workflows/qa.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read

  deploy:
    needs: qa
    runs-on: ubuntu-latest

    environment: ${{ vars.PORTAL_PROJECT_NAME }} (${{ github.ref_name == github.event.repository.default_branch && 'Production' || 'Preview' }})

    permissions:
      actions: read
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup

      - name: Expose secrets and variables as environment variables
        shell: bash
        run: |
          for secret in $(echo '${{ toJSON(secrets) }}' | jq -r 'keys[]'); do
            value=$(echo '${{ toJSON(secrets) }}' | jq -r --arg key "$secret" '.[$key]')
            echo "$secret=$value" >> "$GITHUB_ENV"
          done

          for var in $(echo '${{ toJSON(vars) }}' | jq -r 'keys[]'); do
            value=$(echo '${{ toJSON(vars) }}' | jq -r --arg key "$var" '.[$key]')
            echo "$var=$value" >> "$GITHUB_ENV"
          done

      - name: Build portal
        run: >-
          NODE_OPTIONS=--max_old_space_size=10240
          VITE_SENTRY_RELEASE=${{ github.sha }}
          pnpm --filter @talismn/portal build --sourcemap

      - name: Upload sourcemaps to Sentry
        if: vars.SENTRY_PROJECT != null
        uses: getsentry/action-release@a74facf8a080ecbdf1cb355f16743530d712abb7 # v1.11.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: ${{ github.ref_name == github.event.repository.default_branch && 'production' || 'preview' }}
          version: ${{ github.sha }}
          sourcemaps: apps/portal/build

      - name: Strip sourcemaps before deploy
        run: find apps/portal/build -name '*.map' -type f -delete

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
          workingDirectory: apps/portal
          command: pages deploy build --project-name ${{ vars.PORTAL_PROJECT_NAME }} --branch ${{ github.ref_name }}
