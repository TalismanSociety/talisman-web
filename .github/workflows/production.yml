name: Production

on:
  push:
    branches: [main]

permissions: {}

jobs:
  deploy-pr:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-deploy-pr
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changes=$(git log --no-merges --format='- %s' "origin/production..$GITHUB_SHA")
          body=$(printf 'Two approvals deploy these changes to https://app.talisman.xyz: the second one fast-forwards the production branch to this commit, so there is nothing to merge. QA them on staging first: https://main-talisman-portal.talismn.workers.dev\n\n%s\n' "$changes")
          pr=$(gh pr list --base production --head main --state open --json number --jq '.[].number')
          if [ -z "$pr" ]; then
            gh pr create --base production --head main --title "🚀 Production Deployment" --body "$body"
          else
            gh pr edit "$pr" --body "$body"
          fi
