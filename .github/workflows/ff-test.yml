name: FF test

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  push:
    if: github.event.pull_request.base.ref == 'ff-test-production'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.review.commit_id }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json reviewDecision,mergeStateStatus
          git init -q repo && cd repo
          git fetch -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SHA:refs/heads/ff-test-production"
