minimumReleaseAge: 4320
packages:
  - apps/*
allowBuilds:
  "@reown/appkit": false
  core-js: false
  esbuild: false
  simple-git-hooks: false
  workerd: false
packageExtensions:
  # dist/get-proxy.js imports @polkadot-api/json-rpc-provider without declaring it; without this, pnpm's hidden hoist picks any version in the tree
  "@polkadot-api/json-rpc-provider-proxy@0.4.1":
    dependencies:
      "@polkadot-api/json-rpc-provider": 0.2.0
overrides:
  # keeps a single React: signet-apps-sdk otherwise pulls react 18
  "@talismn/signet-apps-sdk>react": ^19.3.1
  # GHSA-ggr8-5vv4-36mx (high), via @polkadot-api/cli>write-package
  "deepmerge-ts@<8.0.0": ^8.0.2
  # GHSA-g3hv-75wg-m249 (moderate), via @graphql-codegen/cli
  "graphql-config>minimatch": ^11.0.8
auditConfig:
  ignoreGhsas:
    # zod 3 is pinned by @reown/appkit-wallet and @coinbase/cdp-sdk; the fix exists only in zod 4
    - GHSA-mrhx-c7xc-m3w5
