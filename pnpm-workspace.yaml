packages:
  - apps/*
allowBuilds:
  "@swc/core": false
  bufferutil: false
  core-js: false
  es5-ext: false
  esbuild: false
  keccak: false
  simple-git-hooks: false
  utf-8-validate: false
  workerd: false
packageExtensions:
  "@polkadot-api/json-rpc-provider-proxy@0.4.1":
    dependencies:
      "@polkadot-api/json-rpc-provider": 0.2.0
overrides:
  "@types/react": 19.3.0
  "json-stream-stringify": 2.0.4
  "@talismn/signet-apps-sdk>react": ^19.3.1
auditConfig:
  ignoreGhsas:
    - GHSA-95m3-7q98-8xr5
